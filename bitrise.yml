format_version: '13'

project_type: android

workflows:
  build_apk:
    description: Build the PolymarketClient debug APK
    steps:
      - git-clone@8: {}

      - set-java-version@1:
          inputs:
            - java_version: '17'

      - install-missing-android-tools@3: {}

      - android-build@1:
          inputs:
            - project_location: "$BITRISE_SOURCE_DIR"
            - module: "app"
            - variant: "debug"

      - deploy-to-bitrise-io@2: {}
